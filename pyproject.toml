[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ActivationCompress"
version = "1.0.0"
description = "Neural Network Activation Compression Suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kapil Dhinwa", email = "kapildhinwa2010@gmail.com"}
]
keywords = [
    "pytorch",
    "neural-networks",
    "compression",
    "activations",
    "svd",
    "pca",
    "dimensionality-reduction",
    "deep-learning",
    "memory-efficient"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/ActivationCompress"
Documentation = "https://github.com/kapildhinwa2010-dev/ActivationCompress#readme"
Repository = "https://github.com/kapildhinwa2010-dev/ActivationCompress.git"
Issues = "https://github.com/kapildhinwa2010-dev/ActivationCompress/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["activation_compress*"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = "test_*.py"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["activation_compress"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
